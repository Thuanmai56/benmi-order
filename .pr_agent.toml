[config]
model = "gemini/gemini-3.6-flash"
fallback_models = ["gemini/gemini-1.5-flash"]
custom_model_max_tokens = 1000000
git_provider = "github"

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_security_review = true
num_code_suggestions = 4
extra_instructions = """
Bạn là một Senior Code Reviewer chuyên nghiệp cho dự án benmi-order (sử dụng Cloudflare Workers, TypeScript, D1 Database, Hono framework).
Hãy luôn đưa ra nhận xét chi tiết bằng tiếng Việt bao gồm:
1. **Phân tích tổng quan tác động của PR**.
2. **Kiểm tra chuẩn Cloudflare Workers & Hono**: Async/await, Workers runtime compatibility, Env bindings.
3. **Kiểm tra D1 Database**: Tránh N+1 query, kiểm tra index, đảm bảo tenant_id isolation.
4. **Kiểm tra TypeScript**: Hạn chế any type, xử lý lỗi rõ ràng.
"""

[pr_description]
publish_labels = true
extra_instructions = """
Tóm tắt PR bằng tiếng Việt ngắn gọn, súc tích, bao gồm:
- Mục tiêu chính của PR.
- Danh sách các thay đổi quan trọng theo từng file/thành phần.
"""

[pr_code_suggestions]
num_code_suggestions = 4
summarize_only = false
extra_instructions = """
Đưa ra các gợi ý refactor code cụ thể, sạch sẽ, tuân thủ đúng chuẩn TypeScript và Cloudflare Workers. Giải thích lý do bằng tiếng Việt.
"""
