name: Release baseline

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Local regression baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Legacy compatibility tests read pre-migration source with git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benmi-worker-official/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm ci --prefix benmi-worker-official
      - name: Install pinned test browsers
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run local regression baseline
        run: npm run test:release
      - name: Preserve logs and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-baseline/
          if-no-files-found: warn
          retention-days: 14
