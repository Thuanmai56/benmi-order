<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Modals Preview</title>
  <link rel="stylesheet" href="../css/orders.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    .preview-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .preview-btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      cursor: pointer;
    }
    .preview-btn.active {
      background: #00b900;
      border-color: #009900;
    }
  </style>
</head>
<body>
  <div class="preview-controls">
    <button class="preview-btn active" onclick="showModal('startShiftModal')">Show Start Shift Modal</button>
    <button class="preview-btn" onclick="showModal('storeActivationModal')">Show Store Activation Modal</button>
    <button class="preview-btn" onclick="toggleLang()">Switch Lang (zh-TW / vi)</button>
  </div>

  <!-- Start Shift / Audio Unlock Modal -->
  <div id="startShiftModal" class="modal start-shift-modal" style="display: flex;">
    <div class="start-shift-box">
      <div class="start-shift-badge-wrap">
        <div class="start-shift-pulse-ring"></div>
        <div class="start-shift-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            <path d="M4 2C2.8 3.7 2 5.7 2 8"></path>
            <path d="M22 8c0-2.3-.8-4.3-2-6"></path>
          </svg>
        </div>
      </div>
      
      <h2 class="start-shift-title" id="i18n-start-shift-title">
        開始接收訂單
      </h2>
      
      <p class="start-shift-sub" id="i18n-start-shift-desc">
        點擊下方按鈕以啟動即時訂單提示音與工作階段，確保第一時間收到顧客點餐通知。
      </p>

      <div class="start-shift-status-pill">
        <span class="start-shift-status-dot"></span>
        <span id="i18n-start-shift-status">即時連線・就緒接收新訂單</span>
      </div>

      <div class="start-shift-actions">
        <button type="button" class="start-shift-btn" onclick="alert('Start shift triggered!')" id="i18n-btn-start-shift">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span id="i18n-btn-start-shift-text">開始接單 (啟用提示音)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Store Activation Modal (Universal Multi-Tenant POS) -->
  <div id="storeActivationModal" class="modal store-activation-modal" style="display: none;">
    <div class="store-activation-box">
      <div class="store-activation-logo-wrap">
        <img src="../blab_icon.png" alt="BLAB Logo" />
      </div>

      <h2 class="store-activation-title" id="i18n-modal-activation-title">
        門市終端啟用
      </h2>
      <p class="store-activation-sub" id="i18n-modal-activation-sub">
        請輸入門市代碼與管理 PIN 碼以綁定此終端設備
      </p>

      <form id="storeActivationForm" onsubmit="event.preventDefault(); alert('Activated!');" class="store-activation-form">
        <div>
          <label class="store-activation-label" id="i18n-activation-tenant-label">
            門市代碼 (Tenant ID)
          </label>
          <input type="text" id="activation-tenant-id" class="store-activation-input" placeholder="例如: bsc, benmi..." required autocomplete="off" autocapitalize="none" spellcheck="false" />
        </div>

        <div>
          <label class="store-activation-label" id="i18n-activation-pin-label">
            管理 PIN 碼
          </label>
          <input type="password" id="activation-pin" class="store-activation-input" placeholder="預設 12345678" required autocomplete="off" />
        </div>

        <div id="activation-error-msg" class="store-activation-error"></div>

        <button type="submit" id="btn-submit-activation" class="store-activation-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          <span id="i18n-btn-submit-activation-text">啟用終端並開始接單</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    let currentLang = 'zh-TW';
    function showModal(id) {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
      document.getElementById(id).style.display = 'flex';
      document.querySelectorAll('.preview-btn').forEach((b, idx) => {
        if ((id === 'startShiftModal' && idx === 0) || (id === 'storeActivationModal' && idx === 1)) {
          b.classList.add('active');
        } else if (idx < 2) {
          b.classList.remove('active');
        }
      });
    }

    const dicts = {
      'zh-TW': {
        startShiftTitle: "開始接收訂單",
        startShiftDesc: "點擊下方按鈕以啟動即時訂單提示音與工作階段，確保第一時間收到顧客點餐通知。",
        startShiftStatus: "即時連線・就緒接收新訂單",
        btnStartShift: "開始接單 (啟用提示音)",
        modalActivationTitle: "門市終端啟用",
        modalActivationSub: "請輸入門市代碼與管理 PIN 碼以綁定此終端設備",
        activationTenantLabel: "門市代碼 (Tenant ID)",
        activationPinLabel: "管理 PIN 碼",
        btnSubmitActivationText: "啟用終端並開始接單"
      },
      'vi': {
        startShiftTitle: "Bắt đầu nhận đơn",
        startShiftDesc: "Nhấn nút bên dưới để kích hoạt chuông báo và sẵn sàng nhận đơn hàng mới từ khách hàng.",
        startShiftStatus: "Kết nối máy chủ・Sẵn sàng nhận đơn",
        btnStartShift: "Bắt đầu nhận đơn (Bật chuông)",
        modalActivationTitle: "Kích Hoạt Điểm Bán",
        modalActivationSub: "Vui lòng nhập mã quán và mã PIN quản lý để liên kết thiết bị POS này.",
        activationTenantLabel: "Mã quán (Tenant ID)",
        activationPinLabel: "Mã PIN quản lý",
        btnSubmitActivationText: "Kích hoạt thiết bị & Bắt đầu"
      }
    };

    function toggleLang() {
      currentLang = currentLang === 'zh-TW' ? 'vi' : 'zh-TW';
      const d = dicts[currentLang];
      document.getElementById("i18n-start-shift-title").innerText = d.startShiftTitle;
      document.getElementById("i18n-start-shift-desc").innerText = d.startShiftDesc;
      document.getElementById("i18n-start-shift-status").innerText = d.startShiftStatus;
      document.getElementById("i18n-btn-start-shift-text").innerText = d.btnStartShift;

      document.getElementById("i18n-modal-activation-title").innerText = d.modalActivationTitle;
      document.getElementById("i18n-modal-activation-sub").innerText = d.modalActivationSub;
      document.getElementById("i18n-activation-tenant-label").innerText = d.activationTenantLabel;
      document.getElementById("i18n-activation-pin-label").innerText = d.activationPinLabel;
      document.getElementById("i18n-btn-submit-activation-text").innerText = d.btnSubmitActivationText;
    }
  </script>
</body>
</html>
