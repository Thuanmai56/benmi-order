<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">線上點餐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const tenantId = params.get("tenant_id") || "benmi";
            window.__INITIAL_TENANT_ID = tenantId;
            try {
                const cached = localStorage.getItem("tenant_branding_" + tenantId) || localStorage.getItem("tenant_theme_" + tenantId);
                if (cached) {
                    const t = JSON.parse(cached);
                    if (t.brandName) document.title = t.brandName + " 點餐";
                    if (t.brandColor) document.documentElement.style.setProperty('--primary', t.brandColor);
                    if (t.brandColorDark) document.documentElement.style.setProperty('--primary-dark', t.brandColorDark);
                } else if (tenantId === "benmi") {
                    document.title = "Benmi 點餐";
                } else {
                    document.title = "線上點餐";
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <div class="store-header" id="store-header-box">
        <div class="store-header-top">
            <div class="store-logo-wrapper" id="store-logo-wrapper" style="display: none;">
                <img id="store-logo" src="" alt="Logo" class="store-logo">
            </div>
            <div class="store-info">
                <h1 class="store-name" id="store-name"></h1>
                <p class="store-subtitle" id="store-subtitle"></p>
            </div>
            <div class="store-status-wrapper">
                <div id="store-status" class="store-status" style="display: none;">營業中</div>
                <div id="waiting-counter-badge" class="waiting-badge" style="display: none;"></div>
            </div>
        </div>
        <div class="store-details">
            <div class="store-detail-row" id="store-address-row" style="display: none; align-items: center; gap: 8px;">
                <svg class="detail-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span id="store-address" style="font-size: 14.5px; font-weight: 500; color: #374151; line-height: 1.4;"></span>
            </div>
            <div class="store-detail-row store-hours-row" id="store-hours-row" onclick="toggleStoreHours(event)" style="cursor: pointer; display: none;">
                <div style="flex: 1; min-width: 0;">
                    <div class="store-hours-toggle" style="display: flex; align-items: center; justify-content: space-between; user-select: none; gap: 8px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 7px; flex-wrap: wrap;">
                            <svg class="detail-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <span style="font-weight: 700; color: #111; font-size: 14.5px; line-height: 1.4;">營業時間</span>
                            <span id="hours-today-preview" style="font-size: 13px; font-weight: 600; color: #059669; background: #f0fdf4; padding: 2px 8px; border-radius: 6px; border: 1px solid #bbf7d0; line-height: 1.4;">載入中...</span>
                        </div>
                        <div id="hours-toggle-btn" class="hours-toggle-btn">
                            <span id="hours-toggle-text">展開</span>
                            <svg id="hours-arrow-icon" class="hours-arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div class="time-block" id="store-hours-display" style="display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e2e8f0; font-size: 13.5px; line-height: 1.6; color: #374151; padding-left: 23px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const tenantId = window.__INITIAL_TENANT_ID || "benmi";
            const BENMI_DEFAULT_THEME = {
                brandName: "本米",
                brandSubtitle: "Bánh mì Việt Nam<br>越式法國麵包",
                storeAddress: "新北市土城區中央路二段135號",
                logoUrl: "./benmi_logo.png"
            };

            let theme = (tenantId === "benmi") ? BENMI_DEFAULT_THEME : null;
            if (!theme) {
                try {
                    const cached = localStorage.getItem("tenant_theme_" + tenantId);
                    if (cached) theme = JSON.parse(cached);
                } catch(e) {}
            }

            if (theme) {
                document.title = (theme.brandName || "點餐系統") + " 點餐";
                const pageTitle = document.getElementById("page-title");
                if (pageTitle) pageTitle.innerText = (theme.brandName || "點餐系統") + " 點餐";

                const nameEl = document.getElementById("store-name");
                if (nameEl && theme.brandName) nameEl.innerText = theme.brandName;

                const subEl = document.getElementById("store-subtitle");
                if (subEl && theme.brandSubtitle) subEl.innerHTML = theme.brandSubtitle.replace(/\n/g, "<br>");

                const addrEl = document.getElementById("store-address");
                const addrRow = document.getElementById("store-address-row");
                if (addrEl && theme.storeAddress) {
                    addrEl.innerText = theme.storeAddress;
                    if (addrRow) addrRow.style.display = "flex";
                }

                const logoEl = document.getElementById("store-logo");
                const logoWrapper = document.getElementById("store-logo-wrapper");
                if (logoEl && theme.logoUrl) {
                    logoEl.src = theme.logoUrl;
                    if (logoWrapper) logoWrapper.style.display = "flex";
                }

                const statusEl = document.getElementById("store-status");
                if (statusEl) statusEl.style.display = "block";

                const hoursRow = document.getElementById("store-hours-row");
                if (hoursRow) hoursRow.style.display = "flex";
            }
        })();
    </script>

        <!-- Checkout Section -->
        <div class="section-container" id="sec-checkout" style="margin-top: 20px;">

    <div id="image-lightbox" class="custom-alert-overlay" style="display:none; z-index: 2000;"

        <img id="lightbox-img" src=""

    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // --- WORKER BASE & TENANT RESOLUTION ---
        const WORKER_BASE = (window.location.hostname.includes("staging") || window.location.hostname.includes("test") || window.location.hostname.includes("localhost") || window.location.hostname.includes("127.0.0.1"))
            ? "https://platform-worker-staging.thuanmnc.workers.dev"
            : "https://benmi-worker-official.thuanmnc.workers.dev";

        function getTenantIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get("tenant_id") || "benmi";
        }

        const isBenmiTenant = (getTenantIdFromUrl() === "benmi");

        // State
        let menu = { small: {}, large: {}, combo: {}, drinks: {}, topping: {} };
        let imageList = [];
        let storeConfig = null;
        let bootstrapData = null;

        let cart = {};
        let customizeData = {};
        let comboDrinkData = {};
        let currentPopup = null;
        let alertCallback = null;
        let isSubmitting = false;

        // Recommended items for Benmi
        const recommended = new Set(['雙層烤肉', '綜合']);
        const recommendedCombo = new Set(['5 大雙層烤肉+飲料', '6 大綜合+飲料']);

        const itemTranslations = {
            "燒肉": "Braised Pork",
            "火腿": "Vietnamese Ham",
            "雞肉": "Shredded Chicken",
            "烤肉": "Grilled Meat",
            "雙層烤肉": "Double Cheese & Meat",
            "綜合": "Combination Special",
            "越南咖啡": "Vietnamese Milk Coffee",
            "豆漿": "Soy Milk",
            "紅茶": "Black Tea",
            "可樂": "Coca-Cola",
            "雪碧": "Sprite"
        };

        // --- FETCH DATA ---
        async function fetchMenu() {
            try {
                const tenantId = getTenantIdFromUrl();
                if (isBenmiTenant) {
                    const [resMenu, resImage, resConfig] = await Promise.all([
                        fetch(`${WORKER_BASE}/api/menu?tenant_id=${tenantId}&_t=${Date.now()}`, { cache: 'no-store' }),
                        fetch(`${WORKER_BASE}/api/image_list?tenant_id=${tenantId}&_t=${Date.now()}`, { cache: 'no-store' }),
                        fetch(`${WORKER_BASE}/api/config?tenant_id=${tenantId}&_t=${Date.now()}`, { cache: 'no-store' })
                    ]);
                    if (resMenu.ok) menu = await resMenu.json();
                    if (resImage.ok) imageList = await resImage.json();
                    if (resConfig.ok) storeConfig = await resConfig.json();
                    updateMenuOosUI();
                } else {
                    const res = await fetch(`${WORKER_BASE}/api/tenant/bootstrap?tenant_id=${tenantId}&_t=${Date.now()}`, { cache: 'no-store' });
                    if (res.ok) {
                        bootstrapData = await res.json();
                        storeConfig = bootstrapData.tenant ? {
                            allowScheduledPickup: bootstrapData.tenant.allowScheduledPickup,
                            storeStatus: bootstrapData.tenant.storeStatus,
                            operatingHours: bootstrapData.tenant.parsedHours,
                            liffId: bootstrapData.tenant.liffId
                        } : null;
                        applyTenantTheme(bootstrapData.tenant);
                        updateDynamicStockAndPrices();
                    }
                }
                applyPickupConfig();
                checkStoreStatus();
            } catch (e) {
                console.error("Failed to fetch menu or config", e);
            }
        }

        function applyTenantTheme(tenant) {
            if (!tenant) return;
            const tenantId = getTenantIdFromUrl();
            try {
                localStorage.setItem("tenant_branding_" + tenantId, JSON.stringify(tenant));
                localStorage.setItem("tenant_theme_" + tenantId, JSON.stringify(tenant));
            } catch(e) {}
            if (tenant.brandColor) {
                document.documentElement.style.setProperty('--primary', tenant.brandColor);
            }
            if (tenant.brandColorDark) {
                document.documentElement.style.setProperty('--primary-dark', tenant.brandColorDark);
            }
            document.title = (tenant.brandName || "點餐系統") + " 點餐";
            const titleEl = document.getElementById('page-title');
            if (titleEl) titleEl.innerText = (tenant.brandName || "點餐系統") + " 點餐";

            const nameEl = document.getElementById('store-name');
            if (nameEl) nameEl.innerText = tenant.brandName || '';

            const subEl = document.getElementById('store-subtitle');
            if (subEl) subEl.innerHTML = tenant.brandSubtitle ? tenant.brandSubtitle.replace(/\n/g, '<br>') : '';

            const addrEl = document.getElementById('store-address');
            const addrRow = document.getElementById('store-address-row');
            if (addrEl) {
                addrEl.innerText = tenant.storeAddress || '';
                if (addrRow) addrRow.style.display = tenant.storeAddress ? 'flex' : 'none';
            }

            const logoEl = document.getElementById('store-logo');
            const logoWrapper = document.getElementById('store-logo-wrapper');
            if (logoEl) {
                if (tenant.logoUrl) {
                    logoEl.src = tenant.logoUrl;
                    if (logoWrapper) logoWrapper.style.display = 'flex';
                } else {
                    if (logoWrapper) logoWrapper.style.display = 'none';
                }
            }

            const statusEl = document.getElementById('store-status');
            if (statusEl) statusEl.style.display = 'block';

            const hoursRow = document.getElementById('store-hours-row');
            if (hoursRow) hoursRow.style.display = 'flex';
        }

        // --- TIME & TIMEZONE HELPERS ---
        function getTaiwanDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (8 * 3600000));
        }

        function formatTaiwanDateTime(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return {
                dateStr: `${yyyy}-${mm}-${dd}`,
                timeStr: `${hh}:${min}`,
                fullStr: `${yyyy}-${mm}-${dd} ${hh}:${min}`
            };
        }

        function updateAsapTimeDisplay() {
            const timeEl = document.getElementById('asap-current-time');
            if (!timeEl) return;
            const tw = getTaiwanDate();
            const isBusy = (storeConfig && storeConfig.storeStatus === 'busy');
            const targetTime = isBusy ? new Date(tw.getTime() + 60 * 60000) : tw;
            const { fullStr } = formatTaiwanDateTime(targetTime);
            timeEl.innerText = isBusy ? `${fullStr}（繁忙：約 1 小時後）` : fullStr;
        }

        function applyPickupConfig() {
            const pickerGroup = document.getElementById('pickup-time-picker-group');
            const asapNotice = document.getElementById('pickup-time-asap-notice');
            if (!pickerGroup || !asapNotice) return;
            if (storeConfig && storeConfig.allowScheduledPickup === false) {
                pickerGroup.style.display = 'none';
                asapNotice.style.display = 'block';
                updateAsapTimeDisplay();
            } else {
                pickerGroup.style.display = 'block';
                asapNotice.style.display = 'none';
            }
            checkStoreStatus();
        }

        // --- SCROLL & NAV ---
        function scrollToSec(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function isCheckoutSectionVisible() {
            const el = document.getElementById('sec-checkout');
            if (!el) return true;
            const rect = el.getBoundingClientRect();
            const windowHeight = (window.innerHeight || document.documentElement.clientHeight);
            return (rect.top <= windowHeight * 0.75 && rect.bottom >= 80);
        }

        function updateFooterButtonState() {
            const btn = document.getElementById('btn-submit');
            if (!btn || btn.disabled || (typeof isSubmitting !== 'undefined' && isSubmitting)) return;
            if (isCheckoutSectionVisible()) {
                btn.innerText = '確認下單';
            } else {
                btn.innerText = '前往結帳 ➔';
            }
        }

        function handleFooterAction() {
            const hasItem = Object.values(cart).some(q => q > 0);
            if (!hasItem) return customAlert('請先選擇餐點品項加入購物車');

            if (!isCheckoutSectionVisible()) {
                scrollToSec('sec-checkout');
                const checkoutSec = document.getElementById('sec-checkout');
                if (checkoutSec) {
                    checkoutSec.style.transition = 'box-shadow 0.3s ease, border-color 0.3s ease';
                    checkoutSec.style.boxShadow = '0 0 0 3px var(--primary), 0 10px 25px rgba(0,0,0,0.1)';
                    setTimeout(() => { checkoutSec.style.boxShadow = ''; }, 1500);
                }
                updateFooterButtonState();
                return;
            }

            submitOrder();
        }

        const observerOptions = { root: null, rootMargin: '-80px 0px -70% 0px', threshold: 0 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                    const targetBtn = document.querySelector(`.nav-btn[onclick="scrollToSec('${entry.target.id}')"]`);
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                        const nav = document.getElementById('main-nav');
                        if (nav) nav.scrollTo({ left: targetBtn.offsetLeft - 20, behavior: 'smooth' });
                    }
                }
            });
            updateFooterButtonState();
        }, observerOptions);

        window.addEventListener('scroll', () => {
            updateFooterButtonState();
        }, { passive: true });

        // --- ALERT & LIGHTBOX ---
        function customAlert(msg, callback = null) {
            const msgEl = document.getElementById('custom-alert-message');
            if (msgEl) msgEl.innerHTML = msg;
            const alertBox = document.getElementById('custom-alert');
            if (alertBox) alertBox.style.display = 'flex';
            window.alertCallback = callback;
        }

        function closeCustomAlert() {
            const alertBox = document.getElementById('custom-alert');
            if (alertBox) alertBox.style.display = 'none';
            if (window.alertCallback) {
                const cb = window.alertCallback;
                window.alertCallback = null;
                cb();
            }
        }

        function closeAndExitLiff() {
            try {
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    liff.closeWindow();
                }
            } catch (e) {
                console.warn("liff.closeWindow failed:", e);
            }
            try {
                window.close();
            } catch (e) {}

        function getDynamicItemFooterHTML(catSlug, itemName, price, isOos) {

        function updateDynamicStockAndPrices() {

                cat.items.forEach(item => {

                    if (custBtn) {
                        const qty = cart[`${cat.slug}_${item.name}`] || 0;

        // --- CART LOGIC ---
        function updateQty(category, origName, change) {
            const key = category + '_' + origName;
            cart[key] = (cart[key] || 0) + change;
            if (cart[key] < 0) cart[key] = 0;

            const qtySpan = document.getElementById('qty-' + category + '-' + origName);
            if (qtySpan) {
                qtySpan.innerText = cart[key];
                qtySpan.style.color = cart[key] > 0 ? 'var(--primary)' : 'inherit';
            }

            const btn = document.getElementById('customize-btn-' + category + '-' + origName);
            if (btn) {
                if (isBenmiTenant) {
                    btn.style.display = (cart[key] > 0 && category !== 'drinks') ? 'block' : 'none';
                } else {
                    const hasModifiers = bootstrapData?.modifiers && bootstrapData.modifiers.length > 0 && category !== 'drinks';
                    btn.style.display = (cart[key] > 0 && hasModifiers) ? 'block' : 'none';
                }
            }

            if (category === 'combo') renderComboDrinksInline(origName, cart[key]);
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            let totalQty = 0;
            let summaryHTML = '';
            const zhNumbers = ['第一份', '第二份', '第三份', '第四份', '第五份', '第六份', '第七份', '第八份', '第九份', '第十份'];

            if (isBenmiTenant) {
                for (let key in cart) {
                    if (cart[key] > 0) {
                        let [cat, origName] = key.split('_');
                        let qty = cart[key];
                        totalQty += qty;

                        let itemPrice = 0;
                        let displayName = origName;
                        if (cat === 'small') { itemPrice = menu.small[origName] || 0; displayName += ' 小'; }
                        if (cat === 'large') { itemPrice = menu.large[origName] || 0; displayName += ' 大'; }
                        if (cat === 'combo') { itemPrice = menu.combo[origName] || 0; displayName = '套餐 ' + displayName; }
                        if (cat === 'drinks') { itemPrice = menu.drinks[origName] || 0; }

                        let itemModifiersTotal = 0;
                        let portionsHTML = '';

                        if (customizeData[key]) {
                            customizeData[key].slice(0, qty).forEach((c, i) => {
                                let parts = [];
                                if (c.topping && c.topping !== '') {
                                    let topPrice = menu.topping[c.topping] || 0;
                                    itemModifiersTotal += topPrice;
                                    parts.push('加' + c.topping + ' (+$' + topPrice + ')');
                                }
                                if (c.spicy && c.spicy !== '不辣') parts.push(c.spicy);
                                if (c.note && c.note.trim() !== '') parts.push(c.note.trim());

                                if (parts.length > 0) {
                                    let zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                    portionsHTML += `<div style="font-size:13px; color:#6b7280; margin-left:10px; margin-bottom:6px;">↳ ${zhIdx}: ${parts.join(', ')}</div>`;
                                }
                            });
                        }

                        let lineTotal = (qty * itemPrice) + itemModifiersTotal;

                        summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <div style="font-weight:800;">${qty}x ${displayName}</div>
                            <div style="font-weight:700;">$${lineTotal}</div>
                        </div>`;

                        if (cat === 'combo') {
                            let drinks = comboDrinkData[origName] || [];
                            let drinkCounts = {};
                            drinks.slice(0, qty).forEach(d => { drinkCounts[d] = (drinkCounts[d] || 0) + 1; });
                            let drinkStr = Object.entries(drinkCounts).map(([n, c]) => `${n} x${c}`).join('、');
                            if (drinkStr) summaryHTML += `<div style="font-size:13px; color:#6b7280; margin-left:10px; margin-bottom:6px;">↳ 飲料：${drinkStr}</div>`;
                        }

                        summaryHTML += portionsHTML;
                        total += lineTotal;
                        summaryHTML += `<div style="border-bottom: 1px dashed #eee; margin-bottom: 8px;"></div>`;
                    }
                }
            } else {
                // Dynamic Tenant Total Calculation
                const priceMap = {};
                if (bootstrapData?.catalog) {
                    bootstrapData.catalog.forEach(cat => {
                        cat.items.forEach(it => { priceMap[`${cat.slug}_${it.name}`] = it.price; });
                    });
                }
                const modPriceMap = {};
                if (bootstrapData?.modifiers) {
                    bootstrapData.modifiers.forEach(mod => {
                        mod.options.forEach(opt => { modPriceMap[opt.name] = opt.price || 0; });
                    });
                }

                for (let key in cart) {
                    if (cart[key] > 0) {
                        const [catSlug, itemName] = key.split('_');
                        const qty = cart[key];
                        totalQty += qty;

                        const itemBasePrice = priceMap[key] || 0;
                        let itemModifiersTotal = 0;
                        let portionsHTML = '';

                        if (customizeData[key]) {
                            customizeData[key].slice(0, qty).forEach((c, i) => {
                                const parts = [];
                                if (c.single) {
                                    for (let s in c.single) {
                                        const val = c.single[s];
                                        if (val && val !== '不辣' && val !== '不需要') {
                                            const addP = modPriceMap[val] || 0;
                                            if (addP > 0) {
                                                itemModifiersTotal += addP;
                                                parts.push(`${val} (+$${addP})`);
                                            } else {
                                                parts.push(val);
                                            }
                                        }
                                    }
                                }
                                if (c.multiple) {
                                    for (let topName in c.multiple) {
                                        if (c.multiple[topName]) {
                                            const topPrice = modPriceMap[topName] || 0;
                                            itemModifiersTotal += topPrice;
                                            parts.push(`加${topName} (+$${topPrice})`);
                                        }
                                    }
                                }
                                if (c.note && c.note.trim() !== '') parts.push(c.note.trim());

                                if (parts.length > 0) {
                                    const zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                    portionsHTML += `<div style="font-size:13px; color:#6b7280; margin-left:10px; margin-bottom:6px;">↳ ${zhIdx}: ${parts.join(', ')}</div>`;
                                }
                            });
                        }

                        let lineTotal = (qty * itemBasePrice) + itemModifiersTotal;

                        summaryHTML += `
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <div style="font-weight:800; color: #111;">${qty}x ${itemName}</div>
                                <div style="font-weight:700;">$${lineTotal}</div>
                            </div>
                        `;

                        summaryHTML += portionsHTML;
                        total += lineTotal;
                        summaryHTML += `<div style="border-bottom: 1px dashed #eee; margin-bottom: 8px;"></div>`;
                    }
                }
            }

            const totalEl = document.getElementById('total-price');
            if (totalEl) totalEl.innerText = total;

            const summaryContainer = document.getElementById('cart-summary');
            if (summaryContainer) {
                if (totalQty === 0) {
                    summaryContainer.innerHTML = '<div style="text-align:center; color:#9ca3af;">(目前沒有已選商品)</div>';
                } else {
                    summaryHTML += `<div style="display:flex; justify-content:space-between; font-weight:900; margin-top:12px; font-size:16px;">
                        <div>總計</div><div style="color:var(--primary);">$${total}</div>
                    </div>`;
                    summaryContainer.innerHTML = summaryHTML;
                }
            }

            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.innerText = totalQty;
                badge.style.display = totalQty > 0 ? 'block' : 'none';
            }

            updateFooterButtonState();
            return total;
        }

        // --- COMBO DRINKS (BENMI) ---
        function renderComboDrinksInline(origName, qty) {
            const containerId = 'combo-container-combo-' + origName;
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            if (qty === 0) return;

            if (!comboDrinkData[origName]) comboDrinkData[origName] = [];

            const drinksMap = menu.drinks || {};
            const drinkKeys = Object.keys(drinksMap);
            if (drinkKeys.length === 0) return;

            const box = document.createElement('div');
            box.className = 'combo-drinks';
            box.innerHTML = '<strong>🥤 選擇附贈飲料</strong>';

            for (let i = 1; i <= qty; i++) {
                let firstDrink = drinkKeys.find(d => !menu.out_of_stock || !menu.out_of_stock.includes(`drinks:${d}`)) || drinkKeys[0];
                if (!comboDrinkData[origName][i - 1]) comboDrinkData[origName][i - 1] = firstDrink;

                let sel = document.createElement('select');
                for (let d in drinksMap) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    const isDrinkOos = menu.out_of_stock && menu.out_of_stock.includes(`drinks:${d}`);
                    opt.text = `第 ${i} 份：${d}${isDrinkOos ? ' (已售完)' : ''}`;
                    if (isDrinkOos && comboDrinkData[origName][i - 1] !== d) {
                        opt.disabled = true;
                    }
                    if (comboDrinkData[origName][i - 1] === d) opt.selected = true;
                    sel.appendChild(opt);
                }
                sel.onchange = () => {
                    comboDrinkData[origName][i - 1] = sel.value;
                    updateTotal();
                };
                box.appendChild(sel);
            }
            container.appendChild(box);
        }

        // --- CUSTOMIZE POPUP (BOTH BENMI & DYNAMIC TENANTS USE MODERN RADIO PILLS & CHIPS) ---
        function toggleCustomize(category, origName) {
            const key = category + '_' + origName;
            const qty = cart[key];
            if (!qty) return;

            if (!customizeData[key]) customizeData[key] = [];

            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) closePopup(); };

            const box = document.createElement('div');
            box.className = 'popup-box';

            if (isBenmiTenant) {
                // Benmi Modal with Radio Pills for Spicy & Checkbox Chips for Topping
                const displayName = category === 'small' ? origName + ' 小' :
                    category === 'large' ? origName + ' 大' :
                        '套餐 ' + origName;

                box.innerHTML = `
                    <div class="popup-header">
                        <span>${displayName} 客製化</span>
                        <div class="close-btn" onclick="closePopup()">✕</div>
                    </div>
                `;

                for (let i = 0; i < qty; i++) {
                    let data = customizeData[key][i] || { topping: '', spicy: '不辣', note: '' };
                    if (!customizeData[key][i]) customizeData[key][i] = data;

                    const section = document.createElement('div');
                    section.className = 'modifier-section';

                    let sectionInner = `<div style="font-weight: 900; color: var(--primary); font-size: 16px; margin-bottom: 12px;">第 ${i + 1} 份</div>`;

                    // 1. Spicy Radio Pills
                    sectionInner += `
                        <div class="modifier-group-title">
                            <span>選擇辣度</span>
                            <span class="modifier-required-badge">必選</span>
                        </div>
                        <div class="modifier-pills-row">
                    `;
                    const spicyOptions = ['不辣', '微辣', '中辣', '大辣'];
                    spicyOptions.forEach(sp => {
                        const isSelected = (data.spicy === sp);
                        sectionInner += `
                            <div class="modifier-pill ${isSelected ? 'active' : ''}" 
                                 onclick="selectBenmiSpicy('${key}', ${i}, '${sp}', this)">
                                ${sp}
                            </div>
                        `;
                    });
                    sectionInner += `</div>`;

                    // 2. Topping Options
                    sectionInner += `
                        <div class="modifier-group-title">
                            <span>加料 (Topping)</span>
                            <span class="modifier-optional-badge">可選</span>
                        </div>
                        <div class="modifier-checkbox-grid">
                    `;
                    for (let t in menu.topping) {
                        const isToppingOos = menu.out_of_stock && menu.out_of_stock.includes(`topping:${t}`);
                        const isChecked = (data.topping === t);
                        const price = menu.topping[t];
                        sectionInner += `
                            <div class="modifier-checkbox-chip ${isChecked ? 'active' : ''} ${isToppingOos ? 'disabled' : ''}" 
                                 onclick="toggleBenmiTopping('${key}', ${i}, '${t}', this)">
                                <span>${t}</span>
                                <span style="font-size: 12px; opacity: 0.85;">+$${price}</span>
                            </div>
                        `;
                    }
                    sectionInner += `</div>`;

                    // 3. Individual Note
                    sectionInner += `
                        <label style="font-size: 13px; font-weight: 800; color: var(--muted); display: block; margin: 14px 0 4px 0;">個別備註</label>
                        <input type="text" value="${data.note || ''}" placeholder="如：不要香菜" 
                               oninput="saveBenmiCustomNote('${key}', ${i}, this.value)">
                    `;

                    section.innerHTML = sectionInner;
                    box.appendChild(section);
                }

                const okBtn = document.createElement('button');
                okBtn.innerText = '完成設定';
                okBtn.className = 'btn-send';
                okBtn.style.cssText = 'width:100%; margin-top:8px;';
                okBtn.onclick = () => { closePopup(); updateTotal(); };
                box.appendChild(okBtn);

                overlay.appendChild(box);
                overlay._savedScrollY = window.scrollY;
                document.body.style.position = 'fixed';
                document.body.style.top = `-${overlay._savedScrollY}px`;
                document.body.style.left = '0';
                document.body.style.right = '0';
                document.body.style.width = '100%';

                document.body.appendChild(overlay);
                currentPopup = overlay;
            } else {
                // Dynamic Tenant Schema-Driven Popup
                box.innerHTML = `
                    <div class="popup-header">
                        <span>${origName} 客製化設定</span>
                        <div class="close-btn" onclick="closePopup()">✕</div>
                    </div>
                `;

                const modifiers = bootstrapData?.modifiers || [];

                for (let i = 0; i < qty; i++) {
                    if (!customizeData[key][i]) {
                        const defaultSingle = {};
                        modifiers.filter(m => m.selectionType === 'single').forEach(m => {
                            const defOpt = m.options.find(o => o.isDefault) || m.options[0];
                            if (defOpt) defaultSingle[m.slug] = defOpt.name;
                        });
                        customizeData[key][i] = { single: defaultSingle, multiple: {}, note: '' };
                    }

                    const currentPortion = customizeData[key][i];
                    const section = document.createElement('div');
                    section.className = 'modifier-section';

                    let sectionInner = `<div style="font-weight: 900; color: var(--primary); font-size: 16px; margin-bottom: 12px;">第 ${i + 1} 份</div>`;

                    modifiers.forEach(mod => {
                        const reqBadge = mod.isRequired ? `<span class="modifier-required-badge">必選</span>` : `<span class="modifier-optional-badge">可選</span>`;
                        sectionInner += `
                            <div class="modifier-group-title">
                                <span>${mod.name}</span>
                                ${reqBadge}
                            </div>
                        `;

                        if (mod.selectionType === 'single') {
                            sectionInner += `<div class="modifier-pills-row">`;
                            mod.options.forEach(opt => {
                                const isSelected = (currentPortion.single && currentPortion.single[mod.slug] === opt.name);
                                const priceText = opt.price > 0 ? ` (+$${opt.price})` : '';
                                sectionInner += `
                                    <div class="modifier-pill ${isSelected ? 'active' : ''} ${opt.isOutOfStock ? 'disabled' : ''}" 
                                         onclick="selectSingleModifier('${key}', ${i}, '${mod.slug}', '${opt.name}', this)">
                                        ${opt.name}${priceText}
                                    </div>
                                `;
                            });
                            sectionInner += `</div>`;
                        } else if (mod.selectionType === 'multiple') {
                            sectionInner += `<div class="modifier-checkbox-grid">`;
                            mod.options.forEach(opt => {
                                const isChecked = Boolean(currentPortion.multiple && currentPortion.multiple[opt.name]);
                                const priceText = opt.price > 0 ? `+$${opt.price}` : '$0';
                                sectionInner += `
                                    <div class="modifier-checkbox-chip ${isChecked ? 'active' : ''} ${opt.isOutOfStock ? 'disabled' : ''}" 
                                         onclick="toggleMultipleModifier('${key}', ${i}, '${opt.name}', this)">
                                        <span>${opt.name}</span>
                                        <span style="font-size: 12px; opacity: 0.85;">${priceText}</span>
                                    </div>
                                `;
                            });
                            sectionInner += `</div>`;
                        }
                    });

                    sectionInner += `
                        <label style="font-size: 13px; font-weight: 800; color: var(--muted); display: block; margin: 14px 0 4px 0;">個別備註</label>
                        <input type="text" value="${currentPortion.note || ''}" placeholder="例如：不要香菜、醬料分開裝" 
                               oninput="saveCustomNote('${key}', ${i}, this.value)">
                    `;

                    section.innerHTML = sectionInner;
                    box.appendChild(section);
                }

                const okBtn = document.createElement('button');
                okBtn.innerText = '完成設定';
                okBtn.className = 'btn-send';
                okBtn.style.cssText = 'width:100%; margin-top:8px;';
                okBtn.onclick = () => { closePopup(); updateTotal(); };
                box.appendChild(okBtn);

                overlay.appendChild(box);
                overlay._savedScrollY = window.scrollY;
                document.body.style.position = 'fixed';
                document.body.style.top = `-${overlay._savedScrollY}px`;
                document.body.style.left = '0';
                document.body.style.right = '0';
                document.body.style.width = '100%';

                document.body.appendChild(overlay);
                currentPopup = overlay;
            }
        }

        // Benmi modifier helpers
        function selectBenmiSpicy(key, index, spicyVal, el) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][index]) customizeData[key][index] = { topping: '', spicy: '不辣', note: '' };
            customizeData[key][index].spicy = spicyVal;

            const parentRow = el.parentElement;
            if (parentRow) parentRow.querySelectorAll('.modifier-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            updateTotal();
        }

        function toggleBenmiTopping(key, index, topName, el) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][index]) customizeData[key][index] = { topping: '', spicy: '不辣', note: '' };

            if (customizeData[key][index].topping === topName) {
                customizeData[key][index].topping = '';
                el.classList.remove('active');
            } else {
                customizeData[key][index].topping = topName;
                const parentGrid = el.parentElement;
                if (parentGrid) parentGrid.querySelectorAll('.modifier-checkbox-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            updateTotal();
        }

        function saveBenmiCustomNote(key, index, val) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][index]) customizeData[key][index] = { topping: '', spicy: '不辣', note: '' };
            customizeData[key][index].note = val;
        }

        // Dynamic tenant modifier helpers
        function selectSingleModifier(key, portionIdx, modSlug, optName, el) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][portionIdx]) customizeData[key][portionIdx] = { single: {}, multiple: {}, note: '' };
            if (!customizeData[key][portionIdx].single) customizeData[key][portionIdx].single = {};
            customizeData[key][portionIdx].single[modSlug] = optName;

            const parentRow = el.parentElement;
            if (parentRow) parentRow.querySelectorAll('.modifier-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            updateTotal();
        }

        function toggleMultipleModifier(key, portionIdx, optName, el) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][portionIdx]) customizeData[key][portionIdx] = { single: {}, multiple: {}, note: '' };
            if (!customizeData[key][portionIdx].multiple) customizeData[key][portionIdx].multiple = {};

            const isCurrentlyChecked = Boolean(customizeData[key][portionIdx].multiple[optName]);
            if (isCurrentlyChecked) {
                delete customizeData[key][portionIdx].multiple[optName];
                el.classList.remove('active');
            } else {
                customizeData[key][portionIdx].multiple[optName] = true;
                el.classList.add('active');
            }
            updateTotal();
        }

        function saveCustomNote(key, portionIdx, val) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][portionIdx]) customizeData[key][portionIdx] = { single: {}, multiple: {}, note: '' };
            customizeData[key][portionIdx].note = val;
        }

        function closePopup() {
            if (currentPopup) {
                const savedY = currentPopup._savedScrollY || 0;
                document.body.style.position = '';
                document.body.style.top = '';
                document.body.style.left = '';
                document.body.style.right = '';
                document.body.style.width = '';

                currentPopup.remove();
                currentPopup = null;

                setTimeout(() => {
                    const origScroll = document.documentElement.style.scrollBehavior;
                    document.documentElement.style.scrollBehavior = 'auto';
                    window.scrollTo(0, savedY);
                    document.documentElement.style.scrollBehavior = origScroll;
                }, 10);
            }
        }

        // --- ORDER SUBMISSION & LINE LIFF ---
        function generateOrderNumber() {
            const now = new Date();
            const twTime = new Date(now.getTime() + 8 * 3600000);
            const month = String(twTime.getUTCMonth() + 1).padStart(2, '0');
            const day = String(twTime.getUTCDate()).padStart(2, '0');
            const hours = String(twTime.getUTCHours()).padStart(2, '0');
            const mins = String(twTime.getUTCMinutes()).padStart(2, '0');
            const randomSeq = Math.floor(1000 + Math.random() * 9000);
            const prefix = isBenmiTenant ? 'B' : (getTenantIdFromUrl() === 'zhadantongxue' ? 'Z' : 'O');
            return `${prefix}${month}${day}-${hours}${mins}-${randomSeq}`;
        }

        async function submitOrder() {
            if (isSubmitting) return;

            if (storeConfig && storeConfig.storeStatus === 'paused') {
                return customAlert('店家目前暫停接單中，暫時無法下單，敬請見諒！');
            }

            const hasItem = Object.values(cart).some(q => q > 0);
            if (!hasItem) return customAlert('請先選擇餐點品項加入購物車');

            if (!isCheckoutSectionVisible()) {
                scrollToSec('sec-checkout');
                const checkoutSec = document.getElementById('sec-checkout');
                if (checkoutSec) {
                    checkoutSec.style.transition = 'box-shadow 0.3s ease, border-color 0.3s ease';
                    checkoutSec.style.boxShadow = '0 0 0 3px var(--primary), 0 10px 25px rgba(0,0,0,0.1)';
                    setTimeout(() => { checkoutSec.style.boxShadow = ''; }, 1500);
                }
                updateFooterButtonState();
                return;
            }

            const isScheduledEnabled = !(storeConfig && storeConfig.allowScheduledPickup === false);

            if (!isScheduledEnabled) {
                const twTime = getTaiwanDate();
                if (!isStoreOpen(twTime)) {
                    return customAlert('店家目前非營業時間 (休息中)，無法下單');
                }
                const isBusy = (storeConfig && storeConfig.storeStatus === 'busy');
                const targetTime = isBusy ? new Date(twTime.getTime() + 60 * 60000) : twTime;
                const { dateStr, timeStr } = formatTaiwanDateTime(targetTime);
                dateInput = dateStr;
                timeInput = timeStr;
            } else {
                if (!dateInput || !timeInput) {
                    const checkoutSec = document.getElementById('sec-checkout');
                    if (checkoutSec) {
                        checkoutSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        checkoutSec.style.outline = '3px solid var(--primary)';
                        checkoutSec.style.borderRadius = '16px';
                        setTimeout(() => { checkoutSec.style.outline = 'none'; }, 2000);
                    }
                    setTimeout(() => {
                        if (!dateInput && document.getElementById('pickup-date')) document.getElementById('pickup-date').focus();
                        else if (document.getElementById('pickup-time')) document.getElementById('pickup-time').focus();
                    }, 400);
                    return customAlert('請選擇取餐日期與時間 ↓');
                }

                const twNow = getTaiwanDate();
                const [pYear, pMonth, pDay] = dateInput.split('-').map(Number);
                const [pHour, pMin] = timeInput.split(':').map(Number);
                const selectedDateTime = new Date(pYear, pMonth - 1, pDay, pHour, pMin, 0);

                if (selectedDateTime < twNow) {
                    return customAlert('不能選擇過去的時間，請重新選擇取餐時間');
                }

                if (storeConfig && storeConfig.storeStatus === 'busy') {
                    const { dateStr: todayStr } = formatTaiwanDateTime(twNow);
                    if (dateInput === todayStr) {
                        const minAllowedTime = new Date(twNow.getTime() + 60 * 60000);
                        if (selectedDateTime < minAllowedTime) {
                            const { timeStr: minTimeStr } = formatTaiwanDateTime(minAllowedTime);
                            return customAlert(`目前門市繁忙，最快可取餐時間為 ${minTimeStr}（需至少 1 小時後）`);
                        }
                    }
                }

                const pickupDate = new Date(pYear, pMonth - 1, pDay);
                const dayOfWeek = pickupDate.getDay();
                const timeValue = pHour + pMin / 60;

                let isValidTime = false;
                let displayHoursMsg = "";

                if (storeConfig && storeConfig.operatingHours) {
                    const shifts = storeConfig.operatingHours[dayOfWeek] || [];
                    if (shifts.length > 0) {
                        for (let shift of shifts) {
                            const [sH, sM] = shift.start.split(':').map(Number);
                            const [eH, eM] = shift.end.split(':').map(Number);
                            const startVal = sH + sM / 60;
                            const endVal = eH + eM / 60;
                            if (timeValue >= startVal && timeValue <= endVal) {
                                isValidTime = true;
                                break;
                            }
                        }
                        displayHoursMsg = shifts.map(s => `${s.start} - ${s.end}`).join(", ");
                    }
                } else {
                    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    if (isWeekend) {
                        if (timeValue >= 9 && timeValue <= 21) isValidTime = true;
                        displayHoursMsg = "9:00 - 21:00";
                    } else {
                        if (timeValue >= 11 && timeValue <= 21) isValidTime = true;
                        displayHoursMsg = "11:00 - 21:00";
                    }
                }

                if (!isValidTime) {
                    if (displayHoursMsg === "") {
                        return customAlert('當天店家公休，請選擇其他日期');
                    } else {
                        const days = ["日", "一", "二", "三", "四", "五", "六"];
                        return customAlert(`週${days[dayOfWeek]}的營業時間為 ${displayHoursMsg}，請重新選擇取餐時間`);
                    }
                }
            }

            const submitBtn = document.getElementById('btn-submit');
            isSubmitting = true;
            let orderSubmittedSuccessfully = false;

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerText = '處理中...';
                submitBtn.style.cursor = 'not-allowed';
                submitBtn.style.opacity = '0.7';
            }

            try {
                const tenantId = getTenantIdFromUrl();

                if (typeof liff !== 'undefined' && liff.isInClient) {
                    try {
                        if (liff.isInClient() && liff.isLoggedIn && !liff.isLoggedIn()) {
                            const storageKey = isBenmiTenant ? 'benmi_cart_save' : `cart_save_${tenantId}`;
                            localStorage.setItem(storageKey, JSON.stringify({ cart, customizeData, comboDrinkData }));
                            liff.login({ redirectUri: window.location.href });
                            return;
                        }
                    } catch (liffAuthErr) {
                        console.warn("LIFF Auth check ignored:", liffAuthErr);
                    }
                }

                let customerName = "顧客";
                let userId = "guest_" + Date.now();

                if (typeof liff !== 'undefined' && liff.getProfile) {
                    try {
                        const profile = await liff.getProfile();
                        if (profile) {
                            customerName = profile.displayName || customerName;
                            userId = profile.userId || userId;
                        }
                    } catch(e) {}
                }

                const currentTotal = updateTotal();
                const orderNum = generateOrderNumber();
                const zhNumbers = ['第一份', '第二份', '第三份', '第四份', '第五份', '第六份', '第七份', '第八份', '第九份', '第十份'];

                let msg = `[${document.getElementById('store-name')?.innerText || '線上'} 點餐]\n訂單編號：${orderNum}\n📦 訂單內容：\n`;

                if (isBenmiTenant) {
                    for (let key in cart) {
                        if (cart[key] > 0) {
                            let [cat, origName] = key.split('_');
                            let displayName = cat === 'small' ? origName + ' 小' :
                                cat === 'large' ? origName + ' 大' :
                                    cat === 'combo' ? '套餐 ' + origName : origName;

                            msg += `\n${cart[key]}份 x ${displayName}`;

                            if (cat === 'combo') {
                                let drinks = comboDrinkData[origName] || [];
                                let drinkCounts = {};
                                drinks.slice(0, cart[key]).forEach(d => { drinkCounts[d] = (drinkCounts[d] || 0) + 1; });
                                let drinkStr = Object.entries(drinkCounts).map(([n, c]) => `${n} x${c}`).join('、');
                                if (drinkStr) msg += `\n   ↳ 飲料：${drinkStr}`;
                            }

                            if (customizeData[key]) {
                                customizeData[key].slice(0, cart[key]).forEach((c, i) => {
                                    let parts = [];
                                    if (c.topping && c.topping !== '') parts.push('加' + c.topping);
                                    if (c.spicy && c.spicy !== '不辣') parts.push(c.spicy);
                                    if (c.note && c.note.trim() !== '') parts.push(c.note.trim());
                                    if (parts.length > 0) {
                                        let zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                        msg += `\n   ↳ ${zhIdx}: ${parts.join(', ')}`;
                                    }
                                });
                            }
                        }
                    }
                } else {
                    for (let key in cart) {
                        if (cart[key] > 0) {
                            let [catSlug, origName] = key.split('_');
                            msg += `\n${cart[key]}份 x ${origName}`;

                            if (customizeData[key]) {
                                customizeData[key].slice(0, cart[key]).forEach((c, i) => {
                                    const parts = [];
                                    if (c.single) {
                                        for (let s in c.single) {
                                            if (c.single[s] && c.single[s] !== '不辣' && c.single[s] !== '不需要') {
                                                parts.push(c.single[s]);
                                            }
                                        }
                                    }
                                    if (c.multiple) {
                                        for (let t in c.multiple) {
                                            if (c.multiple[t]) parts.push(`加${t}`);
                                        }
                                    }
                                    if (c.note && c.note.trim() !== '') parts.push(c.note.trim());
                                    if (parts.length > 0) {
                                        let zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                        msg += `\n   ↳ ${zhIdx}: ${parts.join(', ')}`;
                                    }
                                });
                            }
                        }
                    }
                }

                msg += `\n\n🕒 取餐時間：${dateInput} ${timeInput}`;
                const mainNote = document.getElementById('note') ? document.getElementById('note').value : '';
                if (mainNote) msg += `\n📝 總備註：${mainNote}`;
                msg += `\n💰 總金額：$${currentTotal}`;

                const orderPayload = {
                    key: orderNum,
                    userId: userId,
                    customer: customerName,
                    time: `${dateInput} ${timeInput}`,
                    content: msg.split('\n\n🕒')[0].replace(/\[.*?點餐\]\n/g, '').replace('[Benmi 點餐]\n', ''),
                    total: currentTotal,
                    note: mainNote,
                    tenant_id: tenantId,
                    liffFallback: false
                };

                const res = await fetch(`${WORKER_BASE}/api/create?tenant_id=${tenantId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Tenant-ID": tenantId
                    },
                    body: JSON.stringify(orderPayload)
                });

                if (!res.ok) throw new Error(`API returned status ${res.status}`);

                orderSubmittedSuccessfully = true;
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = '訂單已送出';
                    submitBtn.style.cursor = 'not-allowed';
                    submitBtn.style.opacity = '0.6';
                }

                // Optional: Attempt to send message to LINE chat if in client
                if (typeof liff !== 'undefined' && liff.isInClient) {
                    try {
                        if (liff.isInClient() && typeof liff.sendMessages === 'function') {
                            await liff.sendMessages([{ type: 'text', text: msg }]);
                        }
                    } catch (liffMsgErr) {
                        console.warn("liff.sendMessages notice:", liffMsgErr);
                    }
                }

                // Reset cart on success
                cart = {};
                customizeData = {};
                comboDrinkData = {};
                updateTotal();

                customAlert(`
                    <div style="margin-bottom: 16px;">
                        <div style="width: 60px; height: 60px; margin: 0 auto; background: #ecfdf5; border: 2px solid #a7f3d0; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div style="font-size: 19px; font-weight: 900; color: #111827; margin-bottom: 6px;">訂單已送出成功！</div>
                    <div style="font-size: 14.5px; line-height: 1.5; color: #4b5563;">店家已收到您的訂單，您可以直接在LINE查看訂單狀態 🙏</div>
                `, () => {
                    closeAndExitLiff();
                });

            } catch (err) {
                console.warn("Primary API flow failed, falling back to LINE message flow:", err);
                try {
                    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient() && typeof liff.sendMessages === 'function') {
                        await liff.sendMessages([{ type: 'text', text: msg }]);
                        orderSubmittedSuccessfully = true;
                        if (submitBtn) {
                            submitBtn.disabled = true;
                            submitBtn.innerText = '訂單已送出';
                            submitBtn.style.cursor = 'not-allowed';
                            submitBtn.style.opacity = '0.6';
                        }
                        cart = {};
                        customizeData = {};
                        comboDrinkData = {};
                        updateTotal();
                        customAlert(`
                            <div style="margin-bottom: 16px;">
                                <div style="width: 60px; height: 60px; margin: 0 auto; background: #ecfdf5; border: 2px solid #a7f3d0; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div style="font-size: 19px; font-weight: 900; color: #111827; margin-bottom: 6px;">訂單已送出成功！</div>
                            <div style="font-size: 14.5px; line-height: 1.5; color: #4b5563;">店家已收到您的訂單，您可以直接在LINE查看訂單狀態 🙏</div>
                        `, () => {
                            closeAndExitLiff();
                        });
                    } else {
                        throw err;
                    }
                } catch (liffErr) {
                    customAlert('⚠️ 訂單送出失敗，請檢查網路連線或稍後再試：<br><br>' + (err.message || '連線逾時'));
                }
            } finally {
                if (!orderSubmittedSuccessfully) {
                    isSubmitting = false;
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = '確認下單';
                        submitBtn.style.cursor = 'pointer';
                        submitBtn.style.opacity = '1';
                    }
                }
            }
        }

        function setTodayDate(forceReset = false) {
            const twNow = getTaiwanDate();
            const { dateStr } = formatTaiwanDateTime(twNow);
            const dateEl = document.getElementById('pickup-date');
            const timeEl = document.getElementById('pickup-time');
            if (dateEl) {
                dateEl.min = dateStr;
                if (forceReset || !dateEl.value || dateEl.value < dateStr) {
                    dateEl.value = dateStr;
                }
            }
            if (timeEl) {
                const isBusy = (storeConfig && storeConfig.storeStatus === 'busy');
                const offsetMinutes = isBusy ? 60 : 20;
                const defaultPickup = new Date(twNow.getTime() + offsetMinutes * 60000);
                const { timeStr: defTimeStr } = formatTaiwanDateTime(defaultPickup);

                if (forceReset || !timeEl.value) {
                    timeEl.value = defTimeStr;
                } else if (dateEl && dateEl.value === dateStr && timeEl.value) {
                    // Self-healing: if cached time is in the past (less than current time + 5m), reset to default
                    const parts = timeEl.value.split(':').map(Number);
                    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                        const selectedTime = new Date(twNow.getFullYear(), twNow.getMonth(), twNow.getDate(), parts[0], parts[1]);
                        if (selectedTime.getTime() < twNow.getTime() + 5 * 60000) {
                            timeEl.value = defTimeStr;
                        }
                    }
                }
            }
        }

        function isStoreOpen(twTime) {
            if (!storeConfig || !storeConfig.operatingHours) {
                const day = twTime.getDay();
                const hours = twTime.getHours();
                const minutes = twTime.getMinutes();
                const timeValue = hours + minutes / 60;
                if (day >= 1 && day <= 5) {
                    return (timeValue >= 11 && timeValue < 21);
                } else {
                    return (timeValue >= 9 && timeValue < 21);
                }
            }
            
            const day = twTime.getDay();
            const hours = twTime.getHours();
            const minutes = twTime.getMinutes();
            const timeValue = hours + minutes / 60;
            
            const shifts = storeConfig.operatingHours[day] || [];
            for (let shift of shifts) {
                const [sH, sM] = shift.start.split(':').map(Number);
                const [eH, eM] = shift.end.split(':').map(Number);
                const startVal = sH + sM / 60;
                const endVal = eH + eM / 60;
                if (timeValue >= startVal && timeValue < endVal) {
                    return true;
                }
            }
            return false;
        }

        function checkStoreStatus() {
            const twTime = getTaiwanDate();
            const isOpen = isStoreOpen(twTime);
            const statusEl = document.getElementById('store-status');
            const pausedBanner = document.getElementById('store-paused-banner');
            const busyBanner = document.getElementById('store-busy-banner');
            const submitBtn = document.getElementById('btn-submit');
            const storeStatus = (storeConfig && storeConfig.storeStatus) ? storeConfig.storeStatus : 'open';

            if (storeStatus === 'paused') {
                if (statusEl) {
                    statusEl.innerText = '暫停接單';
                    statusEl.className = 'store-status paused';
                }
                if (pausedBanner) pausedBanner.style.display = 'flex';
                if (busyBanner) busyBanner.style.display = 'none';
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = '⛔ 店家暫停接單中';
                    submitBtn.style.background = '#9ca3af';
                    submitBtn.style.cursor = 'not-allowed';
                }
            } else if (storeStatus === 'busy') {
                if (statusEl) {
                    statusEl.innerText = isOpen ? '繁忙中 (+1h)' : '休息中';
                    statusEl.className = isOpen ? 'store-status busy' : 'store-status closed';
                }
                if (pausedBanner) pausedBanner.style.display = 'none';
                if (busyBanner) busyBanner.style.display = 'flex';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = '確認下單';
                    submitBtn.style.background = '';
                    submitBtn.style.cursor = '';
                }
            } else {
                if (statusEl) {
                    statusEl.innerText = isOpen ? '營業中' : '休息中';
                    statusEl.className = isOpen ? 'store-status' : 'store-status closed';
                }
                if (pausedBanner) pausedBanner.style.display = 'none';
                if (busyBanner) busyBanner.style.display = 'none';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = '確認下單';
                    submitBtn.style.background = '';
                    submitBtn.style.cursor = '';
                }
            }
        }

        function toggleStoreHours(e) {
            if (e) e.stopPropagation();
            const displayEl = document.getElementById('store-hours-display');
            const arrowEl = document.getElementById('hours-arrow-icon');
            const toggleTextEl = document.getElementById('hours-toggle-text');
            if (displayEl) {
                const isHidden = (displayEl.style.display === 'none' || !displayEl.style.display);
                displayEl.style.display = isHidden ? 'block' : 'none';
                if (arrowEl) arrowEl.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
                if (toggleTextEl) toggleTextEl.innerText = isHidden ? '收合' : '展開';
            }
        }

        function renderStoreOperatingHours() {
            const displayEl = document.getElementById('store-hours-display');
            const todayPreviewEl = document.getElementById('hours-today-preview');
            if (!displayEl) return;
            
            const twTime = getTaiwanDate();
            const todayIdx = twTime.getDay();
            
            let todayHoursStr = "";
            let isTodayOpen = false;

            if (storeConfig && storeConfig.operatingHours) {
                const hrs = storeConfig.operatingHours;
                const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                let html = "";
                
                const getShiftsStr = (dayIdx) => {
                    const shifts = hrs[dayIdx] || [];
                    if (shifts.length === 0) return "公休";
                    return shifts.map(s => `${s.start}-${s.end}`).join(", ");
                };

                const todayShifts = hrs[todayIdx] || [];
                if (todayShifts.length > 0) {
                    todayHoursStr = todayShifts.map(s => `${s.start}-${s.end}`).join(", ");
                    isTodayOpen = true;
                } else {
                    todayHoursStr = "今日公休";
                    isTodayOpen = false;
                }
                
                const monStr = getShiftsStr(1);
                const tueStr = getShiftsStr(2);
                const wedStr = getShiftsStr(3);
                const thuStr = getShiftsStr(4);
                const friStr = getShiftsStr(5);
                const satStr = getShiftsStr(6);
                const sunStr = getShiftsStr(0);
                
                const weekdaysEqual = (monStr === tueStr && tueStr === wedStr && wedStr === thuStr && thuStr === friStr);
                const weekendsEqual = (satStr === sunStr);
                
                if (weekdaysEqual && weekendsEqual) {
                    const isWeekday = (todayIdx >= 1 && todayIdx <= 5);
                    const tagW = isWeekday ? '<span style="font-size: 11px; background: #ecfdf5; color: #059669; padding: 1px 6px; border-radius: 99px; margin-left: 6px; border: 1px solid #a7f3d0;">今天</span>' : '';
                    const tagE = !isWeekday ? '<span style="font-size: 11px; background: #ecfdf5; color: #059669; padding: 1px 6px; border-radius: 99px; margin-left: 6px; border: 1px solid #a7f3d0;">今天</span>' : '';
                    html = `<div ${isWeekday ? 'style="font-weight: 700; color: #059669;"' : ''}>週一~週五&nbsp;&nbsp;${monStr}${tagW}</div>
                            <div ${!isWeekday ? 'style="font-weight: 700; color: #059669;"' : ''}>週六、週日&nbsp;&nbsp;${satStr}${tagE}</div>`;
                } else {
                    for (let i = 1; i <= 7; i++) {
                        const dayIdx = i === 7 ? 0 : i;
                        const isCurrentDay = (dayIdx === todayIdx);
                        const highlightStyle = isCurrentDay ? 'style="font-weight: 700; color: #059669;"' : '';
                        const tag = isCurrentDay ? '<span style="font-size: 11px; background: #ecfdf5; color: #059669; padding: 1px 6px; border-radius: 99px; margin-left: 6px; border: 1px solid #a7f3d0;">今天</span>' : '';
                        html += `<div ${highlightStyle}>${days[dayIdx]}&nbsp;&nbsp;${getShiftsStr(dayIdx)}${tag}</div>`;
                    }
                }
                displayEl.innerHTML = html;
            } else {
                if (todayIdx >= 1 && todayIdx <= 5) {
                    todayHoursStr = "11:00-21:00";
                    isTodayOpen = true;
                } else {
                    todayHoursStr = "9:00-21:00";
                    isTodayOpen = true;
                }
                displayEl.innerHTML = `<div>週一~週五&nbsp;&nbsp;11:00-21:00</div>
                                       <div>週六、週日&nbsp;&nbsp;9:00-21:00</div>`;
            }

            if (todayPreviewEl) {
                if (isTodayOpen) {
                    todayPreviewEl.innerHTML = `今日 <strong style="color: #111827;">${todayHoursStr}</strong>`;
                    todayPreviewEl.style.background = '#f0fdf4';
                    todayPreviewEl.style.color = '#059669';
                    todayPreviewEl.style.borderColor = '#bbf7d0';
                } else {
                    todayPreviewEl.innerHTML = `<strong style="color: #dc2626;">今日公休</strong>`;
                    todayPreviewEl.style.background = '#fef2f2';
                    todayPreviewEl.style.color = '#dc2626';
                    todayPreviewEl.style.borderColor = '#fca5a5';
                }
            }
        }

        // --- INIT APP ---
        async function initApp() {
            const isStaging = (window.location.hostname.includes("staging") || window.location.hostname.includes("test") || window.location.hostname.includes("localhost") || window.location.hostname.includes("127.0.0.1"));
            const defaultLiffId = isStaging ? "2009555608-DMioljsI" : "2009560906-c5taZfiY";

            if (isBenmiTenant) {
                await fetchMenu();
                try {
                    const liffId = storeConfig?.liffId || defaultLiffId;
                    if (liffId) await liff.init({ liffId });
                } catch(e) {
                    console.error("LIFF Init Error", e);
                }
                renderMenuBenmi();
                renderStoreOperatingHours();
                applyPickupConfig();

                try {
                    const saved = localStorage.getItem('benmi_cart_save');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        cart = parsed.cart || {};
                        customizeData = parsed.customizeData || {};
                        comboDrinkData = parsed.comboDrinkData || {};
                        localStorage.removeItem('benmi_cart_save');
                        for (let key in cart) {
                            if (cart[key] > 0) {
                                const [cat, origName] = key.split('_');
                                updateQty(cat, origName, 0);
                            }
                        }
                    }
                } catch(e) {}
            } else {
                await fetchMenu();
                try {
                    const liffId = storeConfig?.liffId || defaultLiffId;
                    if (liffId) await liff.init({ liffId });
                } catch(e) {
                    console.error("LIFF Init Error", e);
                }
                renderDynamicCatalog();
                renderStoreOperatingHours();
                applyPickupConfig();

                try {
                    const tenantId = getTenantIdFromUrl();
                    const saved = localStorage.getItem(`cart_save_${tenantId}`);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        cart = parsed.cart || {};
                        customizeData = parsed.customizeData || {};
                        comboDrinkData = parsed.comboDrinkData || {};
                        localStorage.removeItem(`cart_save_${tenantId}`);
                        for (let key in cart) {
                            if (cart[key] > 0) {
                                const [cat, origName] = key.split('_');
                                updateQty(cat, origName, 0);
                            }
                        }
                    }
                } catch(e) {}
            }

            setTodayDate(true);
            checkStoreStatus();
            setInterval(checkStoreStatus, 60000);
            setInterval(fetchMenu, 15000);
            fetchWaitingCounter();
            setInterval(fetchWaitingCounter, 30000);
            setInterval(updateAsapTimeDisplay, 1000);

            window.addEventListener('pageshow', () => {
                setTodayDate(true);
            });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    setTodayDate(false);
                }
            });
        }

        let indexOrdersETag = "";
        async function fetchWaitingCounter() {
            try {
                const headers = {};
                if (indexOrdersETag) headers["If-None-Match"] = indexOrdersETag;
                const tenantId = getTenantIdFromUrl();
                const res = await fetch(`${WORKER_BASE}/api/orders/waiting-count?tenant_id=${tenantId}`, { headers });
                if (res.status === 304 || !res.ok) return;

                const etag = res.headers.get("ETag");
                if (etag) indexOrdersETag = etag;

                const data = await res.json();
                const badge = document.getElementById("waiting-counter-badge");
                if (badge) {
                    const count = data.waitingCount || 0;
                    if (count > 0) {
                        badge.innerHTML = `<span style="font-size: 15px; line-height: 1;">⏳</span> <span>前方排隊：<strong style="color: #78350f; font-size: 15px;">${count}</strong> 單</span>`;
                        badge.style.display = "inline-flex";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("Error fetching waiting counter:", e);
            }
        }

        initApp();
    </script>
