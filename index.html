<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benmi 點餐</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="store-header">
        <div class="store-header-top">
            <div class="store-logo-wrapper">
                <!-- Vui lòng đảm bảo file benmi_logo.png nằm cùng thư mục -->
                <img src="./benmi_logo.png" alt="Benmi Logo" class="store-logo">
            </div>
            <div class="store-info">
                <h1 class="store-name">本米</h1>
                <p class="store-subtitle">Bánh mì Việt Nam<br>越式法國麵包</p>
            </div>
            <div id="store-status" class="store-status">營業中</div>
        </div>
        <div class="store-details">
            <div class="store-detail-row">
                <span class="detail-icon">📍</span>
                <span>新北市土城區中央路二段135號</span>
            </div>
            <div class="store-detail-row">
                <span class="detail-icon">🕒</span>
                <div class="time-block" id="store-hours-display">
                    <div>週一~週五&nbsp;&nbsp;11:00-21:00</div>
                    <div>週六、週日&nbsp;&nbsp;9:00-21:00</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="sticky-nav" id="main-nav">
        <div class="nav-btn active" onclick="scrollToSec('sec-large')">大麵包</div>
        <div class="nav-btn" onclick="scrollToSec('sec-small')">小麵包</div>
        <div class="nav-btn" onclick="scrollToSec('sec-combo')">套餐</div>
        <div class="nav-btn" onclick="scrollToSec('sec-drink')">飲料</div>
        <div class="nav-btn" onclick="scrollToSec('sec-checkout')">結帳</div>
    </nav>

    <div class="container">
        <div class="section-container" id="sec-large">
            <div class="section-title">🍔 大麵包</div>
            <div class="grid" id="large-list"></div>
        </div>

        <div class="section-container" id="sec-small">
            <div class="section-title">🥖 小麵包</div>
            <div class="grid" id="small-list"></div>
        </div>

        <div class="section-container" id="sec-combo">
            <div class="section-title">🎁 特惠套餐 (含飲料)</div>
            <div class="grid" id="combo-list"></div>
        </div>

        <div class="section-container" id="sec-drink">
            <div class="section-title">🥤 單點飲料</div>
            <div class="grid" id="drink-list"></div>
        </div>

        <div class="section-container" id="sec-checkout" style="margin-top: 20px;">
            <div class="section-title">🛍️ 購物車清單</div>
            <div id="cart-summary"
                style="margin-bottom: 20px; padding: 12px; background: #fff; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; color: #444;">
                <div style="text-align:center; color:#9ca3af;">(目前沒有已選商品)</div>
            </div>

            <div class="section-title">🕒 取餐時間</div>
            <div class="input-group">
                <label style="font-weight: 800; color: var(--primary);">⚠️ 請選擇取餐日期 / 時間</label>
                <div class="datetime-row">
                    <input type="date" id="pickup-date">
                    <input type="time" id="pickup-time">
                </div>
            </div>

            <div class="section-title">📝 其他要求</div>
            <div class="input-group">
                <textarea id="note" rows="3" placeholder="例如：切半、不辣、不要香菜"></textarea>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="total-wrap" onclick="scrollToSec('sec-checkout')">
            <span style="font-size: 32px; line-height:1;">🛒</span>
            <span id="cart-badge"
                style="display:none; position:absolute; top:-6px; right:-10px; background:var(--red); color:#fff; font-size:11px; font-weight:900; border-radius:99px; padding: 2px 6px; min-width:18px; text-align:center;">0</span>
            <span class="total-price">$<span id="total-price">0</span></span>
        </div>
        <button class="btn-send" id="btn-submit" onclick="submitOrder()">確認下單</button>
    </div>

    <div id="custom-alert" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <div class="custom-alert-header">提醒</div>
            <div id="custom-alert-message" class="custom-alert-body"></div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">確定</button>
        </div>
    </div>

    <div id="image-lightbox" class="custom-alert-overlay" style="display:none; z-index: 2000;"
        onclick="closeImageLightbox()">
        <img id="lightbox-img" src=""
            style="max-width: 90%; max-height: 90%; border-radius: 16px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>

        // --- MENU DATA ---
        const WORKER_BASE = "https://benmi-worker-official.thuanmnc.workers.dev";
        let menu = { small: {}, large: {}, combo: {}, drinks: {}, topping: {} };
        let imageList = [];
        let storeConfig = null;

        async function fetchMenu() {
            try {
                const [resMenu, resImage, resConfig] = await Promise.all([
                    fetch(`${WORKER_BASE}/api/menu?_t=${Date.now()}`, { cache: 'no-store' }),
                    fetch(`${WORKER_BASE}/api/image_list?_t=${Date.now()}`, { cache: 'no-store' }),
                    fetch(`${WORKER_BASE}/api/config?_t=${Date.now()}`, { cache: 'no-store' })
                ]);
                if (resMenu.ok) menu = await resMenu.json();
                if (resImage.ok) imageList = await resImage.json();
                if (resConfig.ok) storeConfig = await resConfig.json();
            } catch (e) {
                console.error("Failed to fetch menu or config", e);
            }
        }

        // Recommended items
        const recommended = new Set(['雙層烤肉', '綜合']);
        const recommendedCombo = new Set(['5 大雙層烤肉+飲料', '6 大綜合+飲料']);

        let cart = {};
        let customizeData = {};
        let comboDrinkData = {};
        let currentPopup = null;
        let alertCallback = null;
        let isSubmitting = false;

        // --- NAV / SCROLL ---
        function scrollToSec(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        const observerOptions = { root: null, rootMargin: '-80px 0px -70% 0px', threshold: 0 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                    const targetBtn = document.querySelector(`.nav-btn[onclick="scrollToSec('${entry.target.id}')"]`);
                    if (targetBtn) {
                        targetBtn.classList.add('active');
                        const nav = document.getElementById('main-nav');
                        nav.scrollTo({ left: targetBtn.offsetLeft - 20, behavior: 'smooth' });
                    }
                }
            });
        }, observerOptions);

        // --- ALERT & LIGHTBOX ---
        function customAlert(msg, callback = null) {
            document.getElementById('custom-alert-message').innerHTML = msg;
            document.getElementById('custom-alert').style.display = 'flex';
            window.alertCallback = callback;
        }
        function closeCustomAlert() {
            document.getElementById('custom-alert').style.display = 'none';
            if (alertCallback) { alertCallback(); alertCallback = null; }
        }

        function openImageLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('image-lightbox').style.display = 'flex';
        }
        function closeImageLightbox() {
            document.getElementById('image-lightbox').style.display = 'none';
        }

        // --- MENU RENDER ---
        const itemTranslations = {
            "燒肉": "Braised pork / Thịt nguội",
            "火腿": "Ham / Chả",
            "雞肉": "Chicken / Thịt gà",
            "烤肉": "Grilled Meat / Thịt nướng",
            "雙層烤肉": "Double Cheesebanhmi / Thịt nướng phô mai",
            "綜合": "Mixed / Thập cẩm",
            "越南咖啡": "Coffee with Condensed Milk / Cà phê sữa",
            "豆漿": "Soy milk / Sữa đậu nành",
            "紅茶": "Black Tea / Hồng trà",
            "可樂": "Cocacola / Sprite",
            "雪碧": "Cocacola / Sprite"
        };

        function createItem(displayName, price, category, containerId, origName, isRecommended) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'card';
            div.id = `item-${category}-${origName}`;

            const badgeHTML = isRecommended ? `<span class="badge">👍 推薦</span>` : '';

            const imageKey = `${category}_${origName}`;
            const hasImage = imageList.includes(imageKey);
            const imgHTML = hasImage ? `<img class="item-img" src="${WORKER_BASE}/api/image?name=${encodeURIComponent(imageKey)}&v=2" alt="${origName}" loading="lazy" onclick="openImageLightbox(this.src)" style="cursor: zoom-in;">` : '';

            const trans = itemTranslations[origName] || '';
            const transHTML = trans ? `<div style="font-size: 13px; color: #9ca3af; margin-top: 2px;">${trans}</div>` : '';

            div.innerHTML = `
        <div class="card-main">
            ${imgHTML}
            <div class="card-info">
                <div>
                    <div class="card-title">${displayName} ${badgeHTML}</div>
                    ${transHTML}
                </div>
                <div class="card-footer">
                    <div class="card-price">$${price}</div>
                    <div class="qty-control">
                        <button class="btn-qty" onclick="updateQty('${category}','${origName}',-1)">-</button>
                        <span class="qty-text" id="qty-${category}-${origName}">0</span>
                        <button class="btn-qty" onclick="updateQty('${category}','${origName}',1)">+</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="customize-btn" id="customize-btn-${category}-${origName}" onclick="toggleCustomize('${category}','${origName}')">✏️ 客製化（加料 / 辣度 / 備註）</button>
        <div id="combo-container-${category}-${origName}"></div>
    `;
            container.appendChild(div);
        }

        function renderMenu() {
            for (let name in menu.large) createItem(name + ' 大', menu.large[name], 'large', 'large-list', name, recommended.has(name));
            for (let name in menu.small) createItem(name + ' 小', menu.small[name], 'small', 'small-list', name, recommended.has(name));
            for (let name in menu.combo) createItem('套餐 ' + name, menu.combo[name], 'combo', 'combo-list', name, recommendedCombo.has(name));
            for (let name in menu.drinks) createItem(name, menu.drinks[name], 'drinks', 'drink-list', name, false);

            document.querySelectorAll('.section-container').forEach(sec => observer.observe(sec));
        }

        // --- CART LOGIC ---
        function updateQty(category, origName, change) {
            const key = category + '_' + origName;
            cart[key] = (cart[key] || 0) + change;
            if (cart[key] < 0) cart[key] = 0;

            const qtySpan = document.getElementById('qty-' + category + '-' + origName);
            qtySpan.innerText = cart[key];
            qtySpan.style.color = cart[key] > 0 ? 'var(--primary)' : 'inherit';

            const btn = document.getElementById('customize-btn-' + category + '-' + origName);
            if (btn) btn.style.display = (cart[key] > 0 && category !== 'drinks') ? 'block' : 'none';

            if (category === 'combo') renderComboDrinksInline(origName, cart[key]);
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            let totalQty = 0;
            let summaryHTML = '';
            const zhNumbers = ['第一份', '第二份', '第三份', '第四份', '第五份', '第六份', '第七份', '第八份', '第九份', '第十份'];

            for (let key in cart) {
                if (cart[key] > 0) {
                    let [cat, origName] = key.split('_');
                    let qty = cart[key];
                    totalQty += qty;

                    let itemPrice = 0;
                    let displayName = origName;
                    if (cat === 'small') { itemPrice = menu.small[origName] || 0; displayName += ' 小'; }
                    if (cat === 'large') { itemPrice = menu.large[origName] || 0; displayName += ' 大'; }
                    if (cat === 'combo') { itemPrice = menu.combo[origName] || 0; displayName = '套餐 ' + displayName; }
                    if (cat === 'drinks') { itemPrice = menu.drinks[origName] || 0; }

                    let lineTotal = qty * itemPrice;

                    summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <div style="font-weight:800;">${qty}x ${displayName}</div>
                <div>$${lineTotal}</div>
            </div>`;

                    if (cat === 'combo') {
                        let drinks = comboDrinkData[origName] || [];
                        let drinkCounts = {};
                        drinks.slice(0, qty).forEach(d => { drinkCounts[d] = (drinkCounts[d] || 0) + 1; });
                        let drinkStr = Object.entries(drinkCounts).map(([n, c]) => `${n} x${c}`).join('、');
                        if (drinkStr) summaryHTML += `<div style="font-size:13px; color:#6b7280; margin-left:10px; margin-bottom:6px;">↳ 飲料：${drinkStr}</div>`;
                    }

                    if (customizeData[key]) {
                        customizeData[key].slice(0, qty).forEach((c, i) => {
                            let parts = [];
                            if (c.topping && c.topping !== '') {
                                let topPrice = menu.topping[c.topping] || 0;
                                lineTotal += topPrice;
                                parts.push('加' + c.topping + ' (+$' + topPrice + ')');
                            }
                            if (c.spicy && c.spicy !== '微辣') parts.push(c.spicy);
                            if (c.note && c.note.trim() !== '') parts.push(c.note.trim());

                            if (parts.length > 0) {
                                let zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                summaryHTML += `<div style="font-size:13px; color:#6b7280; margin-left:10px; margin-bottom:6px;">↳ ${zhIdx}: ${parts.join(', ')}</div>`;
                            }
                        });
                    }
                    total += lineTotal;
                    summaryHTML += `<div style="border-bottom: 1px dashed #eee; margin-bottom: 8px;"></div>`;
                }
            }

            document.getElementById('total-price').innerText = total;

            const summaryContainer = document.getElementById('cart-summary');
            if (summaryContainer) {
                if (totalQty === 0) {
                    summaryContainer.innerHTML = '<div style="text-align:center; color:#9ca3af;">(目前沒有已選商品)</div>';
                } else {
                    summaryHTML += `<div style="display:flex; justify-content:space-between; font-weight:900; margin-top:12px; font-size:16px;">
                <div>總計</div><div style="color:var(--primary);">$${total}</div>
            </div>`;
                    summaryContainer.innerHTML = summaryHTML;
                }
            }

            // Update cart badge
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.innerText = totalQty;
                badge.style.display = totalQty > 0 ? 'block' : 'none';
            }

            return total;
        }

        // --- COMBO DRINKS ---
        function renderComboDrinksInline(origName, qty) {
            const containerId = 'combo-container-combo-' + origName;
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            if (qty === 0) return;

            if (!comboDrinkData[origName]) comboDrinkData[origName] = [];

            const box = document.createElement('div');
            box.className = 'combo-drinks';
            box.innerHTML = '<strong>🥤 選擇附贈飲料</strong>';

            for (let i = 1; i <= qty; i++) {
                let firstDrink = Object.keys(menu.drinks)[0];
                if (!comboDrinkData[origName][i - 1]) comboDrinkData[origName][i - 1] = firstDrink;

                let sel = document.createElement('select');
                for (let d in menu.drinks) {
                    let opt = document.createElement('option');
                    opt.value = d;
                    opt.text = `第 ${i} 份：${d}`;
                    if (comboDrinkData[origName][i - 1] === d) opt.selected = true;
                    sel.appendChild(opt);
                }
                sel.onchange = () => { comboDrinkData[origName][i - 1] = sel.value; };
                box.appendChild(sel);
            }
            container.appendChild(box);
        }

        // --- CUSTOMIZE POPUP ---
        function toggleCustomize(category, origName) {
            const key = category + '_' + origName;
            const qty = cart[key];
            if (!qty) return;

            if (!customizeData[key]) customizeData[key] = [];

            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) closePopup(); };

            const box = document.createElement('div');
            box.className = 'popup-box';

            const displayName = category === 'small' ? origName + ' 小' :
                category === 'large' ? origName + ' 大' :
                    '套餐 ' + origName;

            box.innerHTML = `
        <div class="popup-header">
            <span>${displayName} 客製化</span>
            <div class="close-btn" onclick="closePopup()">✕</div>
        </div>`;

            const labelStyle = `font-size: 13px; font-weight: 800; color: var(--muted); display: block; margin: 16px 0 4px 0;`;

            for (let i = 0; i < qty; i++) {
                let data = customizeData[key][i] || { topping: '', spicy: '微辣', note: '' };
                if (!customizeData[key][i]) customizeData[key][i] = data;

                let toppingOptions = '<option value="">不加料</option>';
                for (let t in menu.topping) {
                    toppingOptions += `<option value="${t}" ${data.topping === t ? 'selected' : ''}>${t} +$${menu.topping[t]}</option>`;
                }

                const section = document.createElement('div');
                section.style.cssText = 'margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #f3f4f6;';
                section.innerHTML = `
            <div style="font-weight: 900; color: var(--primary); font-size: 16px; margin-bottom: 12px;">第 ${i + 1} 份</div>
            <div style="display:flex; gap:12px;">
                <div style="flex:1;">
                    <label style="${labelStyle}">加料</label>
                    <select onchange="saveCustomize('${key}',${i},'topping',this.value)">${toppingOptions}</select>
                </div>
                <div style="flex:1;">
                    <label style="${labelStyle}">辣度</label>
                    <select onchange="saveCustomize('${key}',${i},'spicy',this.value)">
                        <option value="不辣" ${data.spicy === '不辣' ? 'selected' : ''}>不辣</option>
                        <option value="微辣" ${data.spicy === '微辣' ? 'selected' : ''}>微辣</option>
                        <option value="中辣" ${data.spicy === '中辣' ? 'selected' : ''}>中辣</option>
                        <option value="大辣" ${data.spicy === '大辣' ? 'selected' : ''}>大辣</option>
                    </select>
                </div>
            </div>
            <label style="${labelStyle}">個別備註</label>
            <input type="text" value="${data.note || ''}" placeholder="如：不要香菜" onkeyup="saveCustomizeNote('${key}',${i},this.value)" onchange="saveCustomizeNote('${key}',${i},this.value)">
        `;
                box.appendChild(section);
            }

            const okBtn = document.createElement('button');
            okBtn.innerText = '完成設定';
            okBtn.className = 'btn-send';
            okBtn.style.cssText = 'width:100%; margin-top:8px;';
            okBtn.onclick = () => { closePopup(); updateTotal(); };
            box.appendChild(okBtn);

            overlay.appendChild(box);
            
            // Save scroll position and lock body
            overlay._savedScrollY = window.scrollY;
            document.body.style.position = 'fixed';
            document.body.style.top = `-${overlay._savedScrollY}px`;
            document.body.style.left = '0';
            document.body.style.right = '0';
            document.body.style.width = '100%';
            
            document.body.appendChild(overlay);
            currentPopup = overlay;
        }

        function saveCustomize(key, index, field, value) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][index]) customizeData[key][index] = {};
            customizeData[key][index][field] = value;
            updateTotal();
        }

        // Separate note handler to avoid popup re-render on mobile
        function saveCustomizeNote(key, index, value) {
            if (!customizeData[key]) customizeData[key] = [];
            if (!customizeData[key][index]) customizeData[key][index] = {};
            customizeData[key][index]['note'] = value;
        }

        function closePopup() {
            if (currentPopup) {
                const savedY = currentPopup._savedScrollY || 0;
                document.body.style.position = '';
                document.body.style.top = '';
                document.body.style.left = '';
                document.body.style.right = '';
                document.body.style.width = '';
                
                currentPopup.remove();
                currentPopup = null;
                
                // Force synchronous layout update then restore scroll without animation
                setTimeout(() => {
                    const originalScrollBehavior = document.documentElement.style.scrollBehavior;
                    document.documentElement.style.scrollBehavior = 'auto';
                    window.scrollTo(0, savedY);
                    document.documentElement.style.scrollBehavior = originalScrollBehavior;
                }, 10);
            }
        }

        // --- ORDER SUBMIT ---
        function generateOrderNumber() {
            const now = new Date();
            const twTime = new Date(now.getTime() + 8 * 3600000);
            const month = String(twTime.getUTCMonth() + 1).padStart(2, '0');
            const day = String(twTime.getUTCDate()).padStart(2, '0');
            const hours = String(twTime.getUTCHours()).padStart(2, '0');
            const mins = String(twTime.getUTCMinutes()).padStart(2, '0');
            const randomSeq = Math.floor(1000 + Math.random() * 9000);
            return `B${month}${day}-${hours}${mins}-${randomSeq}`;
        }

        async function submitOrder() {
            if (isSubmitting) return;

            const hasItem = Object.values(cart).some(q => q > 0);
            if (!hasItem) return customAlert('請選擇品項');

            const dateInput = document.getElementById('pickup-date').value;
            const timeInput = document.getElementById('pickup-time').value;

            if (!dateInput || !timeInput) {
                const timeSection = document.getElementById('sec-checkout');
                if (timeSection) {
                    timeSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    timeSection.style.outline = '3px solid var(--primary)';
                    timeSection.style.borderRadius = '16px';
                    setTimeout(() => { timeSection.style.outline = 'none'; }, 2000);
                }
                setTimeout(() => {
                    if (!dateInput) document.getElementById('pickup-date').focus();
                    else document.getElementById('pickup-time').focus();
                }, 400);
                return customAlert('請先選取取餐日期和時間 ↓');
            }

            const now = new Date();
            const selectedDateTime = new Date(`${dateInput}T${timeInput}`);
            if (selectedDateTime < now) return customAlert('不能選擇過去的時間，請重新選擇');

            const pickupDate = new Date(dateInput);
            const dayOfWeek = pickupDate.getDay();
            const [hours, minutes] = timeInput.split(':').map(Number);
            const timeValue = hours + minutes / 60;

            let isValidTime = false;
            let displayHoursMsg = "";
            
            if (storeConfig && storeConfig.operatingHours) {
                const shifts = storeConfig.operatingHours[dayOfWeek] || [];
                if (shifts.length > 0) {
                    for (let shift of shifts) {
                        const [sH, sM] = shift.start.split(':').map(Number);
                        const [eH, eM] = shift.end.split(':').map(Number);
                        const startVal = sH + sM / 60;
                        const endVal = eH + eM / 60;
                        if (timeValue >= startVal && timeValue <= endVal) {
                            isValidTime = true;
                            break;
                        }
                    }
                    displayHoursMsg = shifts.map(s => `${s.start} - ${s.end}`).join(", ");
                }
            } else {
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                if (isWeekend) {
                    if (timeValue >= 9 && timeValue <= 21) isValidTime = true;
                    displayHoursMsg = "9:00 - 21:00";
                } else {
                    if (timeValue >= 11 && timeValue <= 21) isValidTime = true;
                    displayHoursMsg = "11:00 - 21:00";
                }
            }
            
            if (!isValidTime) {
                if (displayHoursMsg === "") {
                    return customAlert('當天店家公休，請選擇其他日期');
                } else {
                    const days = ["日", "一", "二", "三", "四", "五", "六"];
                    return customAlert(`週${days[dayOfWeek]}的營業時間為 ${displayHoursMsg}，請重新選擇取餐時間`);
                }
            }

            isSubmitting = true;
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中...';

            const currentTotal = updateTotal();
            const orderNum = generateOrderNumber();
            const zhNumbers = ['第一份', '第二份', '第三份', '第四份', '第五份', '第六份', '第七份', '第八份', '第九份', '第十份'];

            let msg = `訂單編號：${orderNum}\n📦 訂單內容：\n`;

            for (let key in cart) {
                if (cart[key] > 0) {
                    let [cat, origName] = key.split('_');
                    let displayName = cat === 'small' ? origName + ' 小' :
                        cat === 'large' ? origName + ' 大' :
                            cat === 'combo' ? '套餐 ' + origName : origName;

                    msg += `\n${cart[key]}份 x ${displayName}`;

                    if (cat === 'combo') {
                        let drinks = comboDrinkData[origName] || [];
                        let drinkCounts = {};
                        drinks.slice(0, cart[key]).forEach(d => { drinkCounts[d] = (drinkCounts[d] || 0) + 1; });
                        let drinkStr = Object.entries(drinkCounts).map(([n, c]) => `${n} x${c}`).join('、');
                        if (drinkStr) msg += `\n   ↳ 飲料：${drinkStr}`;
                    }

                    if (customizeData[key]) {
                        customizeData[key].slice(0, cart[key]).forEach((c, i) => {
                            let parts = [];
                            if (c.topping && c.topping !== '') parts.push('加' + c.topping);
                            if (c.spicy && c.spicy !== '微辣') parts.push(c.spicy);
                            if (c.note && c.note.trim() !== '') parts.push(c.note.trim());
                            if (parts.length > 0) {
                                let zhIdx = zhNumbers[i] || `第 ${i + 1} 份`;
                                msg += `\n   ↳ ${zhIdx}: ${parts.join(', ')}`;
                            }
                        });
                    }
                }
            }

            msg += `\n\n🕒 取餐時間：${dateInput} ${timeInput}`;
            const mainNote = document.getElementById('note').value;
            if (mainNote) msg += `\n📝 總備註：${mainNote}`;
            msg += `\n💰 總金額：$${currentTotal}`;

            if (!liff.isLoggedIn()) {
                localStorage.setItem('benmi_cart_save', JSON.stringify({ cart, customizeData, comboDrinkData }));
                liff.login({ redirectUri: window.location.href });
                return;
            }

            try {
                const profile = await liff.getProfile();
                const orderPayload = {
                    key: orderNum, // Đồng bộ mã đơn hàng
                    userId: profile.userId,
                    customer: profile.displayName,
                    time: `${dateInput} ${timeInput}`,
                    content: msg.split('\n\n🕒')[0].replace('[Benmi 點餐]\n', ''),
                    total: currentTotal,
                    note: mainNote,
                    liffFallback: false
                };

                const res = await fetch(`${WORKER_BASE}/api/create`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(orderPayload)
                });

                if (!res.ok) {
                    throw new Error(`API returned status ${res.status}`);
                }

                // Gửi thành công: Đóng cửa sổ và báo cho khách ngay lập tức
                customAlert('<div style="margin-bottom: 15px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div><div style="font-size: 18px; line-height: 1.4; color: #111;">訂單已送出，店員會馬上跟您確認，請稍等</div>', () => {
                    liff.closeWindow();
                });

                // Gửi tin nhắn lưu vết bất đồng bộ (không chặn luồng thành công của khách)
                liff.sendMessages([{ type: 'text', text: msg }]).catch(e => {
                    console.error("Non-blocking liff.sendMessages failed:", e);
                });

            } catch (err) {
                console.warn("Primary API flow failed, falling back to LINE message flow:", err);
                
                // Fallback: Thử gửi tin nhắn LINE trước để kích hoạt Webhook
                try {
                    await liff.sendMessages([{ type: 'text', text: msg }]);
                    customAlert('<div style="margin-bottom: 15px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div><div style="font-size: 18px; line-height: 1.4; color: #111;">訂單已送出，店員會馬上跟您確認，請稍等</div>', () => {
                        liff.closeWindow();
                    });
                } catch (liffErr) {
                    console.error("LIFF sendMessages fallback also failed:", liffErr);
                    
                    // Fallback cuối cùng: Thử gọi lại API trực tiếp với cờ liffFallback = true để gửi Push Message
                    try {
                        const profile = await liff.getProfile();
                        const orderPayload = {
                            key: orderNum,
                            userId: profile.userId,
                            customer: profile.displayName,
                            time: `${dateInput} ${timeInput}`,
                            content: msg.split('\n\n🕒')[0].replace('[Benmi 點餐]\n', ''),
                            total: currentTotal,
                            note: mainNote,
                            liffFallback: true
                        };
                        const res = await fetch(`${WORKER_BASE}/api/create`, {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify(orderPayload)
                        });
                        if (res.ok) {
                            customAlert('<div style="margin-bottom: 15px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div><div style="font-size: 18px; line-height: 1.4; color: #111;">訂單已送出，店員會馬上跟您確認</div>', () => {
                                liff.closeWindow();
                            });
                            return;
                        }
                    } catch (retryErr) {
                        console.error("Final retry API failed:", retryErr);
                    }

                    if (liffErr.code === "400" || String(liffErr).includes("liffId")) {
                        customAlert('⚠️ 傳送失敗：Vui lòng dùng ứng dụng LINE trên điện thoại để đặt hàng, hoặc báo nhân viên xử lý lỗi.');
                    } else {
                        customAlert('傳送失敗，請重試 (Lỗi LIFF)');
                    }
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerText = '確認下單';
                }
            }
        }

        function setTodayDate() {
            const today = new Date();
            const offsetDate = new Date(today.getTime() + 8 * 3600000);
            const dateStr = offsetDate.toISOString().split('T')[0];
            const dateEl = document.getElementById('pickup-date');
            if (dateEl) { dateEl.value = dateStr; dateEl.min = dateStr; }
        }

        function isStoreOpen(twTime) {
            if (!storeConfig || !storeConfig.operatingHours) {
                const day = twTime.getDay();
                const hours = twTime.getHours();
                const minutes = twTime.getMinutes();
                const timeValue = hours + minutes / 60;
                if (day >= 1 && day <= 5) {
                    return (timeValue >= 11 && timeValue < 21);
                } else {
                    return (timeValue >= 9 && timeValue < 21);
                }
            }
            
            const day = twTime.getDay();
            const hours = twTime.getHours();
            const minutes = twTime.getMinutes();
            const timeValue = hours + minutes / 60;
            
            const shifts = storeConfig.operatingHours[day] || [];
            for (let shift of shifts) {
                const [sH, sM] = shift.start.split(':').map(Number);
                const [eH, eM] = shift.end.split(':').map(Number);
                const startVal = sH + sM / 60;
                const endVal = eH + eM / 60;
                if (timeValue >= startVal && timeValue < endVal) {
                    return true;
                }
            }
            return false;
        }

        function checkStoreStatus() {
            const now = new Date();
            // Chuyển đổi giờ địa phương của client sang giờ UTC+8 (Đài Loan)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const twTime = new Date(utc + (8 * 3600000));
            
            const isOpen = isStoreOpen(twTime);

            const statusEl = document.getElementById('store-status');
            if (isOpen) {
                statusEl.innerText = '營業中';
                statusEl.className = 'store-status';
            } else {
                statusEl.innerText = '休息中';
                statusEl.className = 'store-status closed';
            }
        }

        function renderStoreOperatingHours() {
            const displayEl = document.getElementById('store-hours-display');
            if (!displayEl) return;
            
            if (storeConfig && storeConfig.operatingHours) {
                const hrs = storeConfig.operatingHours;
                const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                let html = "";
                
                const getShiftsStr = (dayIdx) => {
                    const shifts = hrs[dayIdx] || [];
                    if (shifts.length === 0) return "公休";
                    return shifts.map(s => `${s.start}-${s.end}`).join(", ");
                };
                
                const monStr = getShiftsStr(1);
                const tueStr = getShiftsStr(2);
                const wedStr = getShiftsStr(3);
                const thuStr = getShiftsStr(4);
                const friStr = getShiftsStr(5);
                const satStr = getShiftsStr(6);
                const sunStr = getShiftsStr(0);
                
                const weekdaysEqual = (monStr === tueStr && tueStr === wedStr && wedStr === thuStr && thuStr === friStr);
                const weekendsEqual = (satStr === sunStr);
                
                if (weekdaysEqual && weekendsEqual) {
                    html = `<div>週一~週五&nbsp;&nbsp;${monStr}</div>
                            <div>週六、週日&nbsp;&nbsp;${satStr}</div>`;
                } else {
                    for (let i = 1; i <= 7; i++) {
                        const dayIdx = i === 7 ? 0 : i;
                        html += `<div>${days[dayIdx]}&nbsp;&nbsp;${getShiftsStr(dayIdx)}</div>`;
                    }
                }
                displayEl.innerHTML = html;
            } else {
                displayEl.innerHTML = `<div>週一~週五&nbsp;&nbsp;11:00-21:00</div>
                                       <div>週六、週日&nbsp;&nbsp;9:00-21:00</div>`;
            }
        }

        async function initApp() {
            try {
                await liff.init({ liffId: '2009560906-c5taZfiY' });
            } catch(e) {
                console.error("LIFF Init Error", e);
            }

            await fetchMenu();
            renderMenu();
            renderStoreOperatingHours();

            try {
                const saved = localStorage.getItem('benmi_cart_save');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    cart = parsed.cart || {};
                    customizeData = parsed.customizeData || {};
                    comboDrinkData = parsed.comboDrinkData || {};
                    localStorage.removeItem('benmi_cart_save');
                    
                    for (let key in cart) {
                        if (cart[key] > 0) {
                            const [cat, origName] = key.split('_');
                            updateQty(cat, origName, 0);
                        }
                    }
                }
            } catch(e) {}

            setTodayDate();
            checkStoreStatus();
            setInterval(checkStoreStatus, 60000); // Cập nhật trạng thái mỗi phút
        }
        initApp();

    </script>
